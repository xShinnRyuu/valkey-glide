version: 2

updates:
    # Enable version updates for npm (TypeScript/Node)
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      open-pull-requests-limit: 10
      groups:
          patch-updates:
              update-types:
                  - "patch"
          minor-updates:
              update-types:
                  - "minor"
      labels:
          - "dependencies"
          - "node 🐢"

    # Enable version updates for npm (Node client)
    - package-ecosystem: "npm"
      directory: "/node"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      open-pull-requests-limit: 10
      groups:
          patch-updates:
              update-types:
                  - "patch"
          minor-updates:
              update-types:
                  - "minor"
      labels:
          - "dependencies"
          - "node 🐢"

    # Enable version updates for Gradle (Java)
    - package-ecosystem: "gradle"
      directory: "/java"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      open-pull-requests-limit: 10
      groups:
          patch-updates:
              update-types:
                  - "patch"
          minor-updates:
              update-types:
                  - "minor"
      labels:
          - "dependencies"
          - "java ☕"

    # Enable version updates for Cargo (Rust - glide-core)
    - package-ecosystem: "cargo"
      directory: "/glide-core"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      open-pull-requests-limit: 10
      groups:
          patch-updates:
              update-types:
                  - "patch"
          minor-updates:
              update-types:
                  - "minor"
      labels:
          - "dependencies"
          - "Rust ⚙️"

    # Enable version updates for Cargo (Rust - Java wrapper)
    - package-ecosystem: "cargo"
      directory: "/java"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      open-pull-requests-limit: 10
      groups:
          patch-updates:
              update-types:
                  - "patch"
          minor-updates:
              update-types:
                  - "minor"
      labels:
          - "dependencies"
          - "Rust ⚙️"
          - "java ☕"

    # Enable version updates for Cargo (Rust - Python wrapper)
    - package-ecosystem: "cargo"
      directory: "/python"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      open-pull-requests-limit: 10
      groups:
          patch-updates:
              update-types:
                  - "patch"
          minor-updates:
              update-types:
                  - "minor"
      labels:
          - "dependencies"
          - "Rust ⚙️"
          - "python 🐍"

    # Enable version updates for Go modules
    - package-ecosystem: "gomod"
      directory: "/go"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      open-pull-requests-limit: 10
      groups:
          patch-updates:
              update-types:
                  - "patch"
          minor-updates:
              update-types:
                  - "minor"
      labels:
          - "dependencies"
          - "go 🏃"

    # Enable version updates for pip (Python)
    # Use `directories:` (plural) so Dependabot scans both the dev requirements
    # at /python and the per-package pyproject.toml + requirements.txt under
    # glide-async/ and glide-sync/. pyproject.toml is the authoritative source
    # for runtime constraints; without this, bumps only land in requirements.txt
    # and never reach end users.
    - package-ecosystem: "pip"
      directories:
          - "/python"
          - "/python/glide-async"
          - "/python/glide-sync"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      open-pull-requests-limit: 10
      groups:
          patch-updates:
              update-types:
                  - "patch"
          minor-updates:
              update-types:
                  - "minor"
      labels:
          - "dependencies"
          - "python 🐍"

    # Enable version updates for GitHub Actions
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
      open-pull-requests-limit: 5
      groups:
          patch-updates:
              update-types:
                  - "patch"
          minor-updates:
              update-types:
                  - "minor"
      labels:
          - "dependencies"
          - "github-actions"
